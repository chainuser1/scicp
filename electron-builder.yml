appId: com.scriptures-in-view.desktop
productName: Scriptures in View
copyright: Copyright © 2026 Scriptures in View

# ── Auto-update via GitHub Releases ──────────────────────────────────────────
publish:
  provider: github
  owner: chainuser1
  repo: scicp

# Electron entry point (matches package.json "main")
# electron-builder reads this automatically.

directories:
  output: dist-electron
  buildResources: build-resources

# ── Files included in the app bundle ──────────────────────────────────────────
# electron/ and backend/ go into the ASAR; static assets go into extraResources.
# electron/node_modules/better-sqlite3 is the Electron-ABI build (from electron/
# package.json + postinstall electron-rebuild). The root node_modules version is
# compiled for system Node and is explicitly excluded.
files:
  - electron/**
  - backend/**
  - shared/**
  - "electron/node_modules/better-sqlite3/**"
  - "!node_modules/better-sqlite3/**"
  - "!backend/.env"
  - "!backend/logs"
  - "!backend/__tests__"
  - "!**/*.md"
  - "!**/*.map"

# ── Extra resources unpacked alongside the ASAR ───────────────────────────────
# Databases and the built frontend must be plain files (not inside ASAR) because
# SQLite needs real file-system access and @fastify/static serves from a path.
extraResources:
  - from: "resources/db"
    to: "db"
    filter:
      - "**/*.db"
  - from: "frontend/dist"
    to: "frontend-dist"
  - from: "frontend/public/emblem.ico"
    to: "emblem.ico"

# ── Unpack native addons from ASAR ────────────────────────────────────────────
# better-sqlite3 uses a .node native addon; it cannot live inside an ASAR archive.
asarUnpack:
  - "**/*.node"
  - "**/better-sqlite3/**"

# electron/node_modules/better-sqlite3 is pre-compiled for Electron ABI by the
# electron/ package.json postinstall hook (electron-rebuild). No rebuild needed.
npmRebuild: false

# ── Platform targets ──────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: "frontend/public/emblem.ico"

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: "frontend/public/emblem-512.png"

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: "frontend/public/emblem-512.png"
  category: Education

deb:
  maintainer: "Scriptures in View <scriptures-in-view@localhost>"

# ── Windows installer options ─────────────────────────────────────────────────
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Scriptures in View"
  installerIcon: "frontend/public/emblem.ico"
  uninstallerIcon: "frontend/public/emblem.ico"
