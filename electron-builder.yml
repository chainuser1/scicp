appId: com.scripturesinview.desktop
productName: Scriptures in View
copyright: Copyright © 2026 Scriptures in View. All rights reserved.

# ── Auto-update via GitHub Releases ──────────────────────────────────────────
publish:
  provider: github
  owner: chainuser1
  repo: scicp

directories:
  output: dist-electron
  buildResources: build-resources

# ── Files included in the app bundle ──────────────────────────────────────────
# electron/ and backend/ go into the ASAR.
# electron/node_modules: Electron-ABI build of better-sqlite3 + onnxruntime-node + electron-updater.
# electron/backend-deps: ALL transitive backend runtime deps (generated by
#   scripts/sync-electron-deps.js) — bundled at node_modules/ so require() resolves.
# @xenova is included separately (large, already scoped).
files:
  - electron/**
  - backend/**
  - shared/**
  - from: "electron/node_modules"
    to: "electron/node_modules"
    filter:
      - "**/*"
  # All backend transitive deps (generated by scripts/sync-electron-deps.js)
  - from: "electron/backend-deps"
    to: "node_modules"
    filter:
      - "**/*"
  # Large ML/transformer packages kept separate for clarity
  - from: "node_modules/@xenova"
    to: "node_modules/@xenova"
    filter:
      - "**/*"
  - "!node_modules/better-sqlite3/**"
  - "!node_modules/onnxruntime-node/**"
  - "!backend/.env"
  - "!backend/logs"
  - "!backend/__tests__"
  - "!**/*.md"
  - "!**/*.map"

# ── Extra resources unpacked alongside the ASAR ───────────────────────────────
extraResources:
  - from: "resources/db"
    to: "db"
    filter:
      - "**/*.db"
  - from: "frontend/dist"
    to: "frontend-dist"
  - from: "frontend/public/emblem.ico"
    to: "emblem.ico"

# ── Unpack native addons from ASAR ────────────────────────────────────────────
asarUnpack:
  - "**/*.node"
  - "**/better-sqlite3/**"
  - "**/onnxruntime-node/**"
  - "**/better-sqlite3/**"

# electron/node_modules/better-sqlite3 is pre-compiled for Electron ABI.
npmRebuild: false

# ── Platform targets ──────────────────────────────────────────────────────────
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: "frontend/public/emblem.ico"

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: "frontend/public/emblem-512.png"

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: "frontend/public/emblem-512.png"
  category: Education
  # Use safe executable name (no spaces) to avoid fpm tar failure on deb builds
  executableName: scriptures-in-view

deb:
  maintainer: "Scriptures in View <support@scripturesinview.app>"

# ── Windows installer options ─────────────────────────────────────────────────
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Scriptures in View"
  installerIcon: "frontend/public/emblem.ico"
  uninstallerIcon: "frontend/public/emblem.ico"
