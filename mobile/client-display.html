<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>Scriptures in View — Display</title>
    <script>
      // When loaded from LAN (TV browser via local server), bridge events
      // arrive via SSE instead of evaluateJavascript. Dispatch them as the
      // same 'bridge-message' CustomEvents so MobileClient works unchanged.
      (function () {
        if (window.Capacitor) return; // native bridge handles it
        const es = new EventSource(window.location.origin + '/events');
        es.onmessage = function (e) {
          try {
            const detail = JSON.parse(e.data);
            window.dispatchEvent(new CustomEvent('bridge-message', { detail }));
          } catch (_) {}
        };
        es.onerror = function () {
          // SSE will auto-reconnect; no action needed
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client-main.jsx"></script>
  </body>
</html>
