name: Strict CI Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Opt into the upcoming GitHub Actions runtime now.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Emergency fallback: set repository variable ALLOW_UNSECURE_NODE20=true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: ${{ vars.ALLOW_UNSECURE_NODE20 == 'true' && 'true' || 'false' }}

jobs:
  check-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract DBs from GHCR image (no LFS bandwidth)
        run: |
          if docker pull ghcr.io/${{ github.repository }}:latest 2>/dev/null; then
            container=$(docker create ghcr.io/${{ github.repository }}:latest)
            docker cp "$container:/app/resources/db/." resources/db/
            docker rm "$container"
            echo "✓ DBs extracted from GHCR image"
          else
            echo "No GHCR image found — will resolve all DBs from LFS"
          fi
          # Validate each required DB; pull from LFS for any that are missing or
          # invalid (e.g. a new DB added after the last image was built).
          missing=0
          for db in lds-scriptures-sqlite.db ylt-scriptures-sqlite.db \
                    tagalog-scriptures-sqlite.db cebuano-scriptures-sqlite.db; do
            if ! head -c 6 "resources/db/$db" 2>/dev/null | grep -q 'SQLite'; then
              echo "  → $db missing or invalid — fetching from LFS"
              git lfs pull --include="resources/db/$db" \
                && echo "  ✓ $db fetched from LFS" \
                || missing=$((missing + 1))
            else
              echo "  ✓ $db OK"
            fi
          done
          [ "$missing" -eq 0 ] \
            || (echo "ERROR: $missing DB(s) could not be resolved" && exit 1)

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Rebuild native modules for Node.js
        run: npm rebuild better-sqlite3

      - name: Run production readiness check
        run: npm run check:prod
