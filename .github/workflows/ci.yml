name: Strict CI Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Opt into the upcoming GitHub Actions runtime now.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Emergency fallback: set repository variable ALLOW_UNSECURE_NODE20=true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: ${{ vars.ALLOW_UNSECURE_NODE20 == 'true' && 'true' || 'false' }}

jobs:
  check-prod:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install mobile dependencies (lockfile check)
        run: npm ci --prefix mobile

      - name: Rebuild native modules for Node.js
        run: npm rebuild better-sqlite3

      - name: Run production readiness check
        run: npm run check:prod
