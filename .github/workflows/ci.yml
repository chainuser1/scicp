name: Strict CI Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Opt into the upcoming GitHub Actions runtime now.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Emergency fallback: set repository variable ALLOW_UNSECURE_NODE20=true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: ${{ vars.ALLOW_UNSECURE_NODE20 == 'true' && 'true' || 'false' }}

jobs:
  check-prod:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve DBs — git (translation) + GHCR (large analysis DBs)
        run: |
          # Translation DBs are regular git binaries — from checkout above.
          # Only extract large LFS-tracked analysis DBs from the GHCR image.
          LFS_DBS="verse-embeddings.db verse-summaries.db verse-graph.db verse-tags.db \
                   topical-guide.db verse-cross-refs.db triple-index.db \
                   chapter-summaries-fts.db footnotes-lds-summaries.db"
          if docker pull ghcr.io/${{ github.repository }}:latest 2>/dev/null; then
            container=$(docker create ghcr.io/${{ github.repository }}:latest)
            for db in $LFS_DBS; do
              docker cp "$container:/app/resources/db/$db" resources/db/ 2>/dev/null \
                && echo "  ✓ $db from GHCR" || echo "  skipped $db (not in image)"
            done
            docker rm "$container"
          else
            echo "No GHCR image found — falling back to git lfs pull for analysis DBs"
            git lfs pull
          fi
          # Validate translation DBs (from git checkout)
          missing=0
          for db in lds-scriptures-sqlite.db ylt-scriptures-sqlite.db \
                    tagalog-scriptures-sqlite.db cebuano-scriptures-sqlite.db; do
            head -c 6 "resources/db/$db" 2>/dev/null | grep -q 'SQLite' \
              && echo "  ✓ $db" \
              || { echo "  ERROR: $db invalid"; missing=$((missing+1)); }
          done
          [ "$missing" -eq 0 ] || (echo "ERROR: $missing translation DB(s) invalid" && exit 1)

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Rebuild native modules for Node.js
        run: npm rebuild better-sqlite3

      - name: Run production readiness check
        run: npm run check:prod
