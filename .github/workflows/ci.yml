name: Strict CI Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-prod:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install mobile dependencies (lockfile check)
        run: npm ci --prefix mobile

      - name: Rebuild native modules for Node.js
        run: npm rebuild better-sqlite3

      - name: Run production readiness check
        run: npm run check:prod