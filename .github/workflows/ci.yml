name: Strict CI Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  # Opt into the upcoming GitHub Actions runtime now.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Emergency fallback: set repository variable ALLOW_UNSECURE_NODE20=true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: ${{ vars.ALLOW_UNSECURE_NODE20 == 'true' && 'true' || 'false' }}

jobs:
  check-prod:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Cache Git LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfsconfig', '.gitattributes') }}-${{ github.sha }}
          restore-keys: |
            lfs-${{ hashFiles('.lfsconfig', '.gitattributes') }}-

      - name: Pull LFS objects (uses cache when available)
        run: git lfs pull

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Install mobile dependencies (lockfile check)
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Rebuild native modules for Node.js
        run: npm rebuild better-sqlite3

      - name: Run production readiness check
        run: npm run check:prod

      # Prune orphaned LFS objects so old DB versions don't accumulate
      - name: Prune old LFS objects
        run: git lfs prune --verify-remote || true
