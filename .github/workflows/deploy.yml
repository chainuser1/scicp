# Build Docker image with LFS files and push to GHCR.
# Railway deploys the pre-built image (no source build needed).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout with LFS
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Validate DB files are real SQLite
        run: |
          if ! head -c 6 resources/db/lds-scriptures-sqlite.db | grep -q 'SQLite'; then
            echo "ERROR: DB files are LFS pointers, not real databases"
            exit 1
          fi
          echo "✓ DB files are valid SQLite"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:backend && npm run test:shared

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high || true

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
