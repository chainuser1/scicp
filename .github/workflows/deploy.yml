# Build Docker image and push to GHCR.
# Railway deploys the pre-built image (no source build needed).
#
# DB files strategy:
#   - If the triggering commit starts with "data:" (pushed by push-data.sh after a
#     post-training rebuild), pull the LFS DBs fresh from Git LFS — they are the
#     source of truth and must be baked into the new image.
#   - Otherwise, copy analysis DBs from the existing GHCR image to save LFS
#     bandwidth (they haven't changed). If no image exists yet, fall back to LFS.
# This ensures push-data.sh + deploy.yml form a complete round-trip: LFS always
# holds exactly one version of each DB (push-data.sh amends in-place) and the
# deploy image is always up-to-date after a rebuild.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout (translation DBs are regular git binaries; large DBs via image or LFS)
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve DBs — git (translation) + LFS or GHCR (large analysis DBs)
        run: |
          LFS_DBS="concept-embeddings.db verse-embeddings.db verse-summaries.db verse-graph.db verse-tags.db \
                   topical-guide.db verse-cross-refs.db triple-index.db \
                   chapter-summaries-fts.db footnotes-lds-summaries.db"

          COMMIT_MSG=$(git log -1 --format="%s")
          if [[ "$COMMIT_MSG" == data:* ]]; then
            # This is a post-training rebuild commit from push-data.sh.
            # LFS holds the authoritative new DBs — pull them directly.
            echo "data: commit detected — pulling fresh analysis DBs from Git LFS"
            git lfs pull --include="resources/db/*.db"
            for db in $LFS_DBS; do
              head -c 6 "resources/db/$db" 2>/dev/null | grep -q 'SQLite' \
                && echo "  ✓ $db from LFS" || echo "  WARNING: $db not valid SQLite after LFS pull"
            done
          elif docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest 2>/dev/null; then
            # Normal code push — reuse analysis DBs from the last good image
            # to avoid unnecessary LFS bandwidth.
            echo "Reusing analysis DBs from last GHCR image"
            container=$(docker create ghcr.io/${{ env.IMAGE_NAME }}:latest)
            for db in $LFS_DBS; do
              docker cp "$container:/app/resources/db/$db" resources/db/ 2>/dev/null \
                && echo "  ✓ $db from GHCR" || echo "  skipped $db (not in image)"
            done
            docker rm "$container"
          else
            echo "No GHCR image found — falling back to git lfs pull for analysis DBs"
            git lfs pull --include="resources/db/*.db"
          fi

          # Validate translation DBs (regular git binaries, must be valid SQLite)
          missing=0
          for db in lds-scriptures-sqlite.db ylt-scriptures-sqlite.db \
                    tagalog-scriptures-sqlite.db cebuano-scriptures-sqlite.db; do
            head -c 6 "resources/db/$db" 2>/dev/null | grep -q 'SQLite' \
              && echo "  ✓ $db" \
              || { echo "  ERROR: $db invalid — checkout may have failed"; missing=$((missing+1)); }
          done
          [ "$missing" -eq 0 ] || (echo "ERROR: $missing translation DB(s) invalid" && exit 1)

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:backend && npm run test:shared

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high || true

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
