# Build Docker image and push to GHCR.
# Railway deploys the pre-built image (no source build needed).
#
# DB files strategy: instead of fetching from Git LFS (which consumes bandwidth),
# we extract the DB files from the last good GHCR image. The DBs are static
# scripture databases that don't change between most deploys. If no previous
# image exists (first deploy), fall back to LFS.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout (translation DBs are regular git binaries; large DBs via image or LFS)
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract DBs from previous GHCR image
        run: |
          echo "Attempting to extract DBs from ghcr.io/${{ env.IMAGE_NAME }}:latest ..."
          if docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest 2>/dev/null; then
            container=$(docker create ghcr.io/${{ env.IMAGE_NAME }}:latest)
            docker cp "$container:/app/resources/db/." resources/db/
            docker rm "$container"
            echo "✓ DBs extracted from previous image"
          else
            echo "No previous image found — will resolve all DBs from LFS"
          fi
          # Validate all required DBs are real SQLite files.
          # Any missing or invalid DB (e.g. added after the last image was built)
          # is fetched individually from LFS so a single new DB never blocks deploy.
          missing=0
          for db in lds-scriptures-sqlite.db ylt-scriptures-sqlite.db \
                    tagalog-scriptures-sqlite.db cebuano-scriptures-sqlite.db; do
            if ! head -c 6 "resources/db/$db" 2>/dev/null | grep -q 'SQLite'; then
              echo "  → $db missing or invalid — fetching from LFS"
              git lfs pull --include="resources/db/$db" \
                && echo "  ✓ $db fetched from LFS" \
                || missing=$((missing + 1))
            else
              echo "  ✓ $db OK"
            fi
          done
          [ "$missing" -eq 0 ] \
            || (echo "ERROR: $missing DB(s) could not be resolved" && exit 1)

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:backend && npm run test:shared

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high || true

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
