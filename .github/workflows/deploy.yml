# Build Docker image and push to GHCR.
# Railway deploys the pre-built image (no source build needed).
#
# DB files strategy: instead of fetching from Git LFS (which consumes bandwidth),
# we extract the DB files from the last good GHCR image. The DBs are static
# scripture databases that don't change between most deploys. If no previous
# image exists (first deploy), fall back to LFS.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout (no LFS — DBs come from previous image)
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract DBs from previous GHCR image
        run: |
          echo "Attempting to extract DBs from ghcr.io/${{ env.IMAGE_NAME }}:latest ..."
          if docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest 2>/dev/null; then
            container=$(docker create ghcr.io/${{ env.IMAGE_NAME }}:latest)
            docker cp "$container:/app/resources/db/." resources/db/
            docker rm "$container"
            echo "✓ DBs extracted from previous image"
            head -c 6 resources/db/lds-scriptures-sqlite.db | grep -q 'SQLite' \
              && echo "✓ SQLite header verified" \
              || (echo "ERROR: extracted DB is not valid SQLite" && exit 1)
          else
            echo "No previous image found — falling back to Git LFS"
            git lfs pull
            head -c 6 resources/db/lds-scriptures-sqlite.db | grep -q 'SQLite' \
              && echo "✓ LFS DBs verified" \
              || (echo "ERROR: LFS DB is not valid SQLite (LFS pointer?)" && exit 1)
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:backend && npm run test:shared

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high || true

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
