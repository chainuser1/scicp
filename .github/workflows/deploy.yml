# Build Docker image and push to GHCR.
# Railway deploys the pre-built image (no source build needed).
#
# DB files strategy: instead of fetching from Git LFS (which consumes bandwidth),
# we extract the DB files from the last good GHCR image. The DBs are static
# scripture databases that don't change between most deploys. If no previous
# image exists (first deploy), fall back to LFS.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout (translation DBs are regular git binaries; large DBs via image or LFS)
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve DBs — git (translation) + GHCR (large analysis DBs)
        run: |
          # Translation/scripture DBs are regular git binary objects — already
          # in the working tree from the checkout step above. Do NOT copy them
          # from the GHCR image, which may be older than the current commit.
          #
          # Only extract the large LFS-tracked analysis DBs from the GHCR image.
          # These are not in regular git checkout (stored in Git LFS, not as
          # binary objects). Falls back to git lfs pull when no image exists.
          LFS_DBS="concept-embeddings.db verse-embeddings.db verse-summaries.db verse-graph.db verse-tags.db \
                   topical-guide.db verse-cross-refs.db triple-index.db \
                   chapter-summaries-fts.db footnotes-lds-summaries.db"
          if docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest 2>/dev/null; then
            container=$(docker create ghcr.io/${{ env.IMAGE_NAME }}:latest)
            for db in $LFS_DBS; do
              docker cp "$container:/app/resources/db/$db" resources/db/ 2>/dev/null \
                && echo "  ✓ $db from GHCR" || echo "  skipped $db (not in image)"
            done
            docker rm "$container"
          else
            echo "No GHCR image found — falling back to git lfs pull for analysis DBs"
            git lfs pull
          fi
          # Validate translation DBs (must be valid SQLite from git checkout)
          missing=0
          for db in lds-scriptures-sqlite.db ylt-scriptures-sqlite.db \
                    tagalog-scriptures-sqlite.db cebuano-scriptures-sqlite.db; do
            head -c 6 "resources/db/$db" 2>/dev/null | grep -q 'SQLite' \
              && echo "  ✓ $db" \
              || { echo "  ERROR: $db invalid — checkout may have failed"; missing=$((missing+1)); }
          done
          [ "$missing" -eq 0 ] || (echo "ERROR: $missing translation DB(s) invalid" && exit 1)

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:backend && npm run test:shared

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high || true

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
