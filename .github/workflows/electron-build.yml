name: Build Electron Installers

on:
  workflow_dispatch:          # Manual trigger from GitHub UI
  push:
    tags: [ 'v*' ]            # Auto-trigger on version tags (v1.0.0, v1.0.1, etc.)

env:
  # Opt into the upcoming GitHub Actions runtime now.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Emergency fallback: set repository variable ALLOW_UNSECURE_NODE20=true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: ${{ vars.ALLOW_UNSECURE_NODE20 == 'true' && 'true' || 'false' }}

permissions:
  contents: write              # Required to create GitHub Releases

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: dist-electron/*.deb
          - os: windows-latest
            platform: win
            artifact: dist-electron/*.exe
          - os: macos-latest
            platform: mac
            artifact: dist-electron/*.dmg

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Electron native dependencies
        run: npm ci --prefix electron
        # Runs postinstall: electron-rebuild compiles better-sqlite3 for Electron ABI
        # in electron/node_modules — isolated from root/node_modules (system Node ABI)

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Verify native module
        run: ls electron/node_modules/better-sqlite3/build/Release/*.node

      - name: Verify frontend dist
        run: test -f frontend/dist/index.html || (echo "Frontend build failed" && exit 1)

      - name: Build Electron (${{ matrix.platform }})
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: scriptures-in-view-${{ matrix.platform }}-installer-${{ github.ref_name }}
          path: |
            dist-electron/*.exe
            dist-electron/*.deb
            dist-electron/*.AppImage
            dist-electron/*.dmg
          if-no-files-found: ignore

      - name: Publish desktop installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/*.exe
            dist-electron/*.deb
            dist-electron/*.AppImage
            dist-electron/*.dmg
          fail_on_unmatched_files: false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
