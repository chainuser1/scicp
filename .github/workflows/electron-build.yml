name: Build Electron Installers

on:
  workflow_dispatch:          # Manual trigger from GitHub UI
  push:
    tags: [ 'v*' ]            # Auto-trigger on version tags (v1.0.0, v1.0.1, etc.)

env:
  # Opt into the upcoming GitHub Actions runtime now.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Emergency fallback: set repository variable ALLOW_UNSECURE_NODE20=true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: ${{ vars.ALLOW_UNSECURE_NODE20 == 'true' && 'true' || 'false' }}
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: write              # Required to create GitHub Releases
  packages: read               # Required to pull from GHCR

jobs:
  # ── Extract DBs from GHCR image (Linux only — runs before platform builds) ──
  fetch-dbs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (needed for LFS fallback)
        uses: actions/checkout@v5
        with:
          lfs: false          # Don't download all LFS objects upfront; pull selectively below

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract DBs from GHCR image; fill gaps from LFS
        run: |
          if docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest 2>/dev/null; then
            container=$(docker create ghcr.io/${{ env.IMAGE_NAME }}:latest)
            mkdir -p resources/db
            docker cp "$container:/app/resources/db/." resources/db/
            docker rm "$container"
            echo "✓ DBs extracted from GHCR image"
          else
            echo "No GHCR image found — will resolve all DBs from LFS"
          fi
          # Validate each required DB; pull from LFS for any that are missing or
          # invalid (e.g. a new DB added after the last image was built).
          missing=0
          for db in lds-scriptures-sqlite.db ylt-scriptures-sqlite.db \
                    tagalog-scriptures-sqlite.db cebuano-scriptures-sqlite.db; do
            if ! head -c 6 "resources/db/$db" 2>/dev/null | grep -q 'SQLite'; then
              echo "  → $db missing or invalid — fetching from LFS"
              git lfs pull --include="resources/db/$db" \
                && echo "  ✓ $db fetched from LFS" \
                || missing=$((missing + 1))
            else
              echo "  ✓ $db OK"
            fi
          done
          [ "$missing" -eq 0 ] \
            || (echo "ERROR: $missing DB(s) could not be resolved" && exit 1)

      - name: Upload DBs as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: scicp-databases
          path: resources/db/
          retention-days: 1

  build:
    needs: fetch-dbs
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: dist-electron/*.deb
          - os: windows-latest
            platform: win
            artifact: dist-electron/*.exe
          - os: macos-latest
            platform: mac
            artifact: dist-electron/*.dmg

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        # No lfs: true — DBs come from the fetch-dbs job artifact

      - name: Download DBs artifact
        uses: actions/download-artifact@v4
        with:
          name: scicp-databases
          path: resources/db/

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Electron native dependencies
        run: npm ci --prefix electron
        # Runs postinstall: electron-rebuild compiles better-sqlite3 for Electron ABI
        # in electron/node_modules — isolated from root/node_modules (system Node ABI)

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Sync backend runtime deps for Electron bundle
        run: node scripts/sync-electron-deps.js

      - name: Verify native module
        run: ls electron/node_modules/better-sqlite3/build/Release/*.node

      - name: Verify frontend dist
        run: test -f frontend/dist/index.html || (echo "Frontend build failed" && exit 1)

      - name: Build Electron (${{ matrix.platform }})
        shell: bash
        run: |
          # Linux deb: fpm stages the entire app in TMPDIR — default /tmp (tmpfs) can be too small
          if [ "$RUNNER_OS" = "Linux" ]; then
            export TMPDIR="$HOME/electron-tmp-build"
            mkdir -p "$TMPDIR"
          fi
          npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: scriptures-in-view-${{ matrix.platform }}-installer-${{ github.ref_name }}
          path: |
            dist-electron/*.exe
            dist-electron/*.deb
            dist-electron/*.AppImage
            dist-electron/*.dmg
          if-no-files-found: ignore

      - name: Publish desktop installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/*.exe
            dist-electron/*.deb
            dist-electron/*.AppImage
            dist-electron/*.dmg
          fail_on_unmatched_files: false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
