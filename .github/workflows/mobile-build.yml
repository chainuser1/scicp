name: Build Mobile Apps

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

env:
  # Opt into the upcoming GitHub Actions runtime now.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Emergency fallback: set repository variable ALLOW_UNSECURE_NODE20=true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: ${{ vars.ALLOW_UNSECURE_NODE20 == 'true' && 'true' || 'false' }}

permissions:
  contents: write

jobs:
  # ── Android APKs (Presenter + TV) ──────────────────────────────────────
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compute artifact suffix
        run: echo "ARTIFACT_SUFFIX=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      # ── Presenter APK (default build) ──────────────────────────────────
      - name: Build Presenter web assets
        working-directory: mobile
        run: npm run build

      - name: Add Capacitor Android platform
        working-directory: mobile
        run: rm -rf android && npx cap add android

      - name: Sync Capacitor Android
        working-directory: mobile
        run: npx cap sync android

      - name: Patch Android versionCode + versionName
        run: |
          GRADLE="mobile/android/app/build.gradle"
          VERSION=$(node -p "require('./mobile/package.json').version")
          # versionCode: major*10000 + minor*100 + patch (e.g. 3.0.0 → 30000)
          IFS='.' read -r MAJ MIN PAT <<< "$VERSION"
          VCODE=$(( MAJ * 10000 + MIN * 100 + PAT ))
          sed -i "s/versionCode [0-9]*/versionCode $VCODE/" "$GRADLE"
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" "$GRADLE"
          echo "✓ Android versionCode=$VCODE versionName=$VERSION"

      - name: Patch AndroidManifest — deep links + permissions
        run: python3 .github/scripts/patch_android_manifest.py mobile/android/app/src/main/AndroidManifest.xml

      - name: Apply custom Android launcher icon
        run: |
          SRC="mobile/public/emblem-512.png"
          for d in mobile/android/app/src/main/res/mipmap-{mdpi,hdpi,xhdpi,xxhdpi,xxxhdpi}; do
            cp "$SRC" "$d/ic_launcher.png"
            cp "$SRC" "$d/ic_launcher_round.png"
            cp "$SRC" "$d/ic_launcher_foreground.png"
          done

      - name: Decode Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/android/app/release.keystore
            echo "KEYSTORE_AVAILABLE=true" >> $GITHUB_ENV
          else
            echo "KEYSTORE_AVAILABLE=false" >> $GITHUB_ENV
          fi

      - name: Build Presenter APK
        working-directory: mobile/android
        env:
          KEYSTORE_AVAILABLE: ${{ env.KEYSTORE_AVAILABLE }}
          KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_STORE_PASS }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_KEY_PASS }}
        run: |
          if [ "$KEYSTORE_AVAILABLE" = "true" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_STORE_PASS" \
              -Pandroid.injected.signing.key.alias="$KEYSTORE_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEYSTORE_KEY_PASS"
          else
            ./gradlew assembleDebug
          fi

      - name: Version-stamp Presenter APK
        run: |
          if [ "$KEYSTORE_AVAILABLE" = "true" ]; then
            SRC="mobile/android/app/build/outputs/apk/release/app-release.apk"
          else
            SRC="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          DST="mobile/android/app/build/outputs/apk/scriptures-in-view-${{ env.ARTIFACT_SUFFIX }}-android.apk"
          cp "$SRC" "$DST"

      # ── TV APK (VITE_APP_MODE=tv) ─────────────────────────────────────
      - name: Build TV web assets
        working-directory: mobile
        run: VITE_APP_MODE=tv npm run build

      - name: Re-sync Capacitor for TV build
        working-directory: mobile
        run: npx cap sync android

      - name: Add Android TV leanback support to manifest
        run: |
          MANIFEST="mobile/android/app/src/main/AndroidManifest.xml"
          # Add leanback and touchscreen uses-feature before closing </manifest>
          sed -i 's|</manifest>|    <uses-feature android:name="android.software.leanback" android:required="false" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n</manifest>|' "$MANIFEST"
          echo "✓ Android TV leanback support added"

      - name: Build TV APK
        working-directory: mobile/android
        env:
          KEYSTORE_AVAILABLE: ${{ env.KEYSTORE_AVAILABLE }}
          KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_STORE_PASS }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_KEY_PASS }}
        run: |
          if [ "$KEYSTORE_AVAILABLE" = "true" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_STORE_PASS" \
              -Pandroid.injected.signing.key.alias="$KEYSTORE_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEYSTORE_KEY_PASS"
          else
            ./gradlew assembleDebug
          fi

      - name: Version-stamp TV APK
        run: |
          if [ "$KEYSTORE_AVAILABLE" = "true" ]; then
            SRC="mobile/android/app/build/outputs/apk/release/app-release.apk"
          else
            SRC="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          DST="mobile/android/app/build/outputs/apk/scriptures-in-view-${{ env.ARTIFACT_SUFFIX }}-tv.apk"
          cp "$SRC" "$DST"

      # ── Upload & Publish ───────────────────────────────────────────────
      - name: Upload Presenter APK
        uses: actions/upload-artifact@v5
        with:
          name: scriptures-in-view-android-apk-${{ env.ARTIFACT_SUFFIX }}
          path: mobile/android/app/build/outputs/apk/scriptures-in-view-${{ env.ARTIFACT_SUFFIX }}-android.apk
          if-no-files-found: warn

      - name: Upload TV APK
        uses: actions/upload-artifact@v5
        with:
          name: scriptures-in-view-tv-apk-${{ env.ARTIFACT_SUFFIX }}
          path: mobile/android/app/build/outputs/apk/scriptures-in-view-${{ env.ARTIFACT_SUFFIX }}-tv.apk
          if-no-files-found: warn

      - name: Publish APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mobile/android/app/build/outputs/apk/scriptures-in-view-${{ env.ARTIFACT_SUFFIX }}-android.apk
            mobile/android/app/build/outputs/apk/scriptures-in-view-${{ env.ARTIFACT_SUFFIX }}-tv.apk
          fail_on_unmatched_files: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
