name: Build Mobile Apps

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

env:
  # Opt into the upcoming GitHub Actions runtime now.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Emergency fallback: set repository variable ALLOW_UNSECURE_NODE20=true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: ${{ vars.ALLOW_UNSECURE_NODE20 == 'true' && 'true' || 'false' }}

permissions:
  contents: write
  packages: read

jobs:
  # ── Extract DBs from GHCR image (Linux only — shared by Android + iOS) ──
  fetch-dbs:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract DBs from GHCR image (no LFS bandwidth)
        run: |
          if docker pull ghcr.io/${{ github.repository }}:latest 2>/dev/null; then
            container=$(docker create ghcr.io/${{ github.repository }}:latest)
            mkdir -p mobile-dbs
            docker cp "$container:/app/resources/db/." mobile-dbs/
            docker rm "$container"
            head -c 6 mobile-dbs/lds-scriptures-sqlite.db | grep -q 'SQLite' \
              && echo "✓ DBs extracted from GHCR image" \
              || (echo "ERROR: extracted DB is not valid SQLite" && exit 1)
          else
            echo "No GHCR image found — falling back to Git LFS"
            mkdir -p mobile-dbs
            git lfs pull
            cp resources/db/*.db mobile-dbs/
          fi

      - name: Upload DBs as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: scicp-mobile-databases
          path: mobile-dbs/
          retention-days: 1

  # ── Android APK ─────────────────────────────────────────────────────────
  android:
    needs: fetch-dbs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compute artifact suffix
        run: echo "ARTIFACT_SUFFIX=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Download DBs artifact
        uses: actions/download-artifact@v4
        with:
          name: scicp-mobile-databases
          path: mobile/public/assets/db/

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install root dependencies
        run: npm install --no-audit --no-fund


      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Build web assets
        working-directory: mobile
        run: npm run build

      - name: Add Capacitor Android platform
        working-directory: mobile
        run: npx cap add android

      - name: Sync Capacitor Android
        working-directory: mobile
        run: npx cap sync android

      - name: Apply custom Android launcher icon
        run: |
          SRC="mobile/public/emblem-512.png"
          for d in mobile/android/app/src/main/res/mipmap-{mdpi,hdpi,xhdpi,xxhdpi,xxxhdpi}; do
            cp "$SRC" "$d/ic_launcher.png"
            cp "$SRC" "$d/ic_launcher_round.png"
            cp "$SRC" "$d/ic_launcher_foreground.png"
          done

      - name: Decode Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/android/app/release.keystore
            echo "KEYSTORE_AVAILABLE=true" >> $GITHUB_ENV
          else
            echo "KEYSTORE_AVAILABLE=false" >> $GITHUB_ENV
          fi

      - name: Build Android APK
        working-directory: mobile/android
        env:
          KEYSTORE_AVAILABLE: ${{ env.KEYSTORE_AVAILABLE }}
          KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_STORE_PASS }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_KEY_PASS }}
        run: |
          if [ "$KEYSTORE_AVAILABLE" = "true" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_STORE_PASS" \
              -Pandroid.injected.signing.key.alias="$KEYSTORE_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEYSTORE_KEY_PASS"
          else
            ./gradlew assembleDebug
          fi

      - name: Version-stamp APK filename
        run: |
          if [ "$KEYSTORE_AVAILABLE" = "true" ]; then
            SRC="mobile/android/app/build/outputs/apk/release/app-release.apk"
          else
            SRC="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          DST="mobile/android/app/build/outputs/apk/scriptures-in-view-${{ env.ARTIFACT_SUFFIX }}-android.apk"
          cp "$SRC" "$DST"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: scriptures-in-view-android-apk-${{ env.ARTIFACT_SUFFIX }}
          path: mobile/android/app/build/outputs/apk/scriptures-in-view-${{ env.ARTIFACT_SUFFIX }}-android.apk
          if-no-files-found: warn

      - name: Publish Android APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/android/app/build/outputs/apk/scriptures-in-view-${{ env.ARTIFACT_SUFFIX }}-android.apk
          fail_on_unmatched_files: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── iOS Archive ─────────────────────────────────────────────────────────
  ios:
    needs: fetch-dbs
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compute artifact suffix
        run: echo "ARTIFACT_SUFFIX=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Download DBs artifact
        uses: actions/download-artifact@v4
        with:
          name: scicp-mobile-databases
          path: mobile/public/assets/db/

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Rebuild better-sqlite3 for macOS Node
        run: npm rebuild better-sqlite3


      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Build web assets
        working-directory: mobile
        run: npm run build

      - name: Add Capacitor iOS platform
        working-directory: mobile
        run: npx cap add ios

      - name: Sync Capacitor iOS
        working-directory: mobile
        run: npx cap sync ios

      - name: Build iOS archive
        working-directory: mobile/ios/App
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "${{ runner.temp }}/scriptures-in-view-${{ env.ARTIFACT_SUFFIX }}.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload xcarchive
        uses: actions/upload-artifact@v5
        with:
          name: scriptures-in-view-ios-xcarchive-${{ env.ARTIFACT_SUFFIX }}
          path: ${{ runner.temp }}/scriptures-in-view-${{ env.ARTIFACT_SUFFIX }}.xcarchive
          if-no-files-found: warn
