name: Build Mobile Apps

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  # ── Android APK ─────────────────────────────────────────────────────────
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute artifact suffix
        run: echo "ARTIFACT_SUFFIX=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install root dependencies
        run: npm ci

      - name: FTS tables pre-built in DBs (no-op)
        run: npm run build-fts

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Build web assets
        working-directory: mobile
        run: npm run build

      - name: Add Android platform and sync
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply custom Android launcher icon
        run: |
          SRC="mobile/public/emblem-512.png"
          for d in mobile/android/app/src/main/res/mipmap-{mdpi,hdpi,xhdpi,xxhdpi,xxxhdpi}; do
            cp "$SRC" "$d/ic_launcher.png"
            cp "$SRC" "$d/ic_launcher_round.png"
            cp "$SRC" "$d/ic_launcher_foreground.png"
          done

      - name: Build Android APK (debug, installable)
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Version-stamp APK filename
        run: |
          SRC="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          DST="mobile/android/app/build/outputs/apk/debug/scriptures-in-view-${{ env.ARTIFACT_SUFFIX }}-android-debug.apk"
          cp "$SRC" "$DST"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scriptures-in-view-android-apk-${{ env.ARTIFACT_SUFFIX }}
          path: mobile/android/app/build/outputs/apk/debug/scriptures-in-view-${{ env.ARTIFACT_SUFFIX }}-android-debug.apk
          if-no-files-found: warn

  # ── iOS Archive ─────────────────────────────────────────────────────────
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute artifact suffix
        run: echo "ARTIFACT_SUFFIX=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 for macOS Node
        run: npm rebuild better-sqlite3

      - name: FTS tables pre-built in DBs (no-op)
        run: npm run build-fts

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Build web assets
        working-directory: mobile
        run: npm run build

      - name: Add iOS platform and sync
        working-directory: mobile
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build iOS archive
        working-directory: mobile/ios/App
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath "${{ runner.temp }}/scriptures-in-view-${{ env.ARTIFACT_SUFFIX }}.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload xcarchive
        uses: actions/upload-artifact@v4
        with:
          name: scriptures-in-view-ios-xcarchive-${{ env.ARTIFACT_SUFFIX }}
          path: ${{ runner.temp }}/scriptures-in-view-${{ env.ARTIFACT_SUFFIX }}.xcarchive
          if-no-files-found: warn
